# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: release
on:
  push:
    tags:
      - v*
permissions:
  contents: write
jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos:
          - linux
          - darwin
          - windows
        goarch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test -p 1 ./...
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          bin=jse
          if [ "$GOOS" = windows ]; then bin=jse.exe; fi
          go build -trimpath \
            -ldflags "-s -w \
              -X main.version=${GITHUB_REF_NAME} \
              -X main.commit=${GITHUB_SHA::7} \
              -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/$bin" ./cmd/jse
      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          pkg="jse_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          cp README.md LICENSE dist/
          if [ "$GOOS" = windows ]; then
            (cd dist && zip -q "${pkg}.zip" jse.exe README.md LICENSE \
              && rm jse.exe README.md LICENSE)
          else
            (cd dist && tar -czf "${pkg}.tar.gz" jse README.md LICENSE \
              && rm jse README.md LICENSE)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jse-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum jse_* > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "${GITHUB_REF_NAME}"
